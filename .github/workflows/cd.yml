name: Manual application release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI run on main (retained artifact)
        required: true
      sha:
        description: Full reviewed commit SHA (also for rollback)
        required: true
      operation:
        type: choice
        options: [deploy, rollback]
        required: true
      migrate:
        description: Run reviewed forward migrations before activation
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ inputs.sha }}
      RUN_ID: ${{ inputs.run_id }}
      OPERATION: ${{ inputs.operation }}
      MIGRATE: ${{ inputs.migrate }}
      CD_ENABLED: ${{ vars.CD_ENABLED }}
      RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      DOCUMENT_NAME: ${{ vars.RELEASE_DOCUMENT }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate environment and artifact provenance
        run: python deployment/phase10a/cd.py verify
      - uses: actions/download-artifact@v4
        with:
          name: application-${{ inputs.sha }}
          path: release-output
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Upload and stage verified artifact
        run: python deployment/phase10a/cd.py stage
      - name: Separate forward migration (failure stops activation)
        if: inputs.migrate && inputs.operation == 'deploy'
        run: python deployment/phase10a/cd.py migrate
      - name: Activate artifact and local readiness/smoke; restore previous artifact on failure
        run: python deployment/phase10a/cd.py activate
      - name: External HTTPS smoke test
        run: python deployment/phase10a/cd.py smoke
